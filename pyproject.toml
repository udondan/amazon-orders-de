[project]
name = "amazon-orders-de"
version = "1.0.0"
description = "An amazon-orders language package for amazon.de, which parses its pages in English"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Schroeder" }]
requires-python = ">=3.10"
dependencies = [
    "amazon-orders>=4.8.1,<5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/udondan/amazon-orders-de"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "responses==0.26.3",
    "ruff==0.17.0",
    "types-python-dateutil==2.9.0.20260807",
    "types-requests==2.33.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amazon_orders_de"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Overrides of amazon-orders' class attributes and properties, whose names and types it defines.
"amazon_orders_de/constants.py" = ["N802", "RUF012"]
"amazon_orders_de/selectors.py" = ["RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["amazon_orders_de"]
# amazon-orders ships no py.typed, so its classes, which this package subclasses, and their methods are Any.
disallow_subclassing_any = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["amazonorders.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
