name: Integration Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: amazon-orders-de-integration-singleton

jobs:
  test:
    name: Integration Test
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      DEBUG: "True"
      AMAZON_USERNAME: ${{ secrets.AMAZON_USERNAME }}
      AMAZON_PASSWORD: ${{ secrets.AMAZON_PASSWORD }}
      AMAZON_OTP_SECRET_KEY: ${{ secrets.AMAZON_OTP_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify credentials are set
        run: |
          if [ -z "$AMAZON_USERNAME" ] || [ -z "$AMAZON_PASSWORD" ]; then
            echo "::error::Set the AMAZON_USERNAME and AMAZON_PASSWORD repo secrets."
            exit 1
          fi
      - name: Install
        run: pip install -e ".[dev]"
      - name: Integration test
        run: pytest tests/integration
      # Debug output holds the raw pages of a real account, so it isn't uploaded as an artifact
