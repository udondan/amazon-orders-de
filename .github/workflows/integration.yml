---
name: Integration Test

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday morning: a login every day makes Amazon more likely to challenge it.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: amazon-orders-de-integration-singleton

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: 1
      # The logs of a public repo are public, and debug output logs every URL, with the account's Order numbers.
      DEBUG: "False"
      AMAZON_USERNAME: ${{ secrets.AMAZON_USERNAME }}
      AMAZON_PASSWORD: ${{ secrets.AMAZON_PASSWORD }}
      AMAZON_OTP_SECRET_KEY: ${{ secrets.AMAZON_OTP_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify credentials are set
        run: |
          if [ -z "$AMAZON_USERNAME" ] || [ -z "$AMAZON_PASSWORD" ]; then
            echo "::error::Set the AMAZON_USERNAME and AMAZON_PASSWORD repo secrets."
            exit 1
          fi

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: mise run install

      - name: Integration test
        run: mise run integration-test
