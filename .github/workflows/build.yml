name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # REQUEST_COOKIES isn't released yet, so test against amazon-orders' develop branch until it is
        run: |
          pip install -e ".[dev]"
          pip install "amazon-orders @ git+https://github.com/alexdlaird/amazon-orders@develop"
      - name: Lint
        run: flake8 amazon_orders_de tests scripts
      - name: Type check
        run: mypy
      - name: Unit tests
        run: pytest
